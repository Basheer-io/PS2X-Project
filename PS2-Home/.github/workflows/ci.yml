name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PS2Home.sln
      - run: dotnet build PS2Home.sln --configuration Release --no-restore
      - run: dotnet test PS2Home.sln --configuration Release --no-build
